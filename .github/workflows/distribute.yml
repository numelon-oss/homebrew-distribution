name: Distribution

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      package:
        description: Package to update. leave tag empty to rebuild the existing catalogue
        required: false
        type: string
      tag:
        description: Published stable tag, e.g. v3.2.1
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  pages: read

concurrency:
  group: distribution
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      winget_manifest: ${{ steps.ingest.outputs.winget_manifest }}
      winget_id: ${{ steps.ingest.outputs.winget_id }}
      winget_version: ${{ steps.ingest.outputs.winget_version }}
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5

      - name: Install APT publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils gnupg

      - name: Ingest published release
        id: ingest
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ github.event.client_payload.package || inputs.package }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" && ( -z "$PACKAGE" || -z "$RELEASE_TAG" ) ]]; then
            echo 'Release notifications require both package and tag.' >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ -z "$PACKAGE" ]]; then
              echo 'Specify a package when supplying a release tag.' >&2
              exit 1
            fi
            python3 scripts/distribution.py update "$PACKAGE" "$RELEASE_TAG"
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          package, tag = os.environ["PACKAGE"], os.environ["RELEASE_TAG"]
          if Path("releases", package, tag + ".json").is_file():
              identifier = json.loads(Path("packages.json").read_text())["packages"][package]["winget_id"]
              version = tag.removeprefix("v")
              path = Path("winget/manifests", identifier[0].lower(), *identifier.split("."), version)
              print(f"winget_manifest={path.as_posix()}")
              print(f"winget_id={identifier}")
              print(f"winget_version={version}")
          PY
          fi

      - name: Render Homebrew and WinGet metadata
        run: python3 scripts/distribution.py render

      - name: Build APT repository and landing page
        run: bash scripts/build-apt.sh

      - name: Sign and verify APT catalogue
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: bash scripts/sign-apt.sh

      - name: Check signed catalogue with APT
        run: |
          set -euo pipefail
          verification_dir=$(mktemp -d)
          trap 'sudo rm -r -- "$verification_dir"' EXIT
          chmod 0755 "$verification_dir"
          mkdir -p "$verification_dir/lists/partial" "$verification_dir/cache/archives/partial"
          gpg --batch --dearmor --output "$verification_dir/keyring.gpg" public/numelon-oss-gh-archive-keyring.asc
          chmod 0644 "$verification_dir/keyring.gpg"
          printf 'deb [signed-by=%s/keyring.gpg] file:%s/.site stable main\n' \
            "$verification_dir" "$PWD" > "$verification_dir/sources.list"
          sudo apt-get \
            -o "Dir::Etc::sourcelist=$verification_dir/sources.list" \
            -o 'Dir::Etc::sourceparts=-' \
            -o "Dir::State::lists=$verification_dir/lists" \
            -o "Dir::Cache=$verification_dir/cache" \
            update

      - name: Commit package metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- Formula releases winget
          if ! git diff --cached --quiet; then
            git commit -m 'Update published package metadata'
            git push origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site

      - name: Upload WinGet submission
        if: steps.ingest.outputs.winget_manifest != ''
        uses: actions/upload-artifact@v6
        with:
          name: winget-submission
          path: ${{ steps.ingest.outputs.winget_manifest }}/*.yaml
          if-no-files-found: error

  winget:
    name: Submit WinGet PR
    needs: build
    if: needs.build.outputs.winget_manifest != ''
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - uses: actions/download-artifact@v7
        with:
          name: winget-submission
          path: winget-submission
      - name: Submit manifests to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PACKAGE_IDENTIFIER: ${{ needs.build.outputs.winget_id }}
          PACKAGE_VERSION: ${{ needs.build.outputs.winget_version }}
        run: ./scripts/submit-winget.ps1 -Identifier $env:PACKAGE_IDENTIFIER -Version $env:PACKAGE_VERSION -ManifestPath winget-submission

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
